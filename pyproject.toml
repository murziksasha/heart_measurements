[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg_app"
version = "0.1.0"
description = "Pure-Python ER1 ECG app (rewrite of the Viatom AI-ECG portable app)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ecg-vendor-import = "ecg_app.importers.vendor_import:main"

[tool.setuptools.packages.find]
include = ["ecg_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
